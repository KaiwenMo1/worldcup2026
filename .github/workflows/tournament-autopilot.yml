name: Tournament autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: tournament-autopilot-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run agentic tournament update
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          WORLD_CUP_API_BASE_URL: ${{ vars.WORLD_CUP_API_BASE_URL }}
          WORLD_CUP_EVENT_FEED_URL: ${{ vars.WORLD_CUP_EVENT_FEED_URL }}
          WORLD_CUP_EVENT_FEED_API_KEY: ${{ secrets.WORLD_CUP_EVENT_FEED_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: python scripts/run_update_agent.py --apply --include-provider --run-arena
      - name: Commit durable tournament updates
        run: |
          git config user.name "worldcup-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/observed_matches.csv \
            data/live_state.json \
            data/live_team_state.csv \
            data/confirmed_lineups.csv \
            data/player_availability.csv \
            data/player_candidates.csv \
            data/player_match_stats.csv \
            data/player_match_team_features.csv \
            data/squad_features.csv \
            data/worldcup_squads.csv \
            data/normalized \
            data/derived \
            data/prediction_arena \
            data/agentic_update \
            data/tournament_autopilot_status.json
          git add data/lineup_observations.csv data/lineup_sync_status.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: refresh observed tournament state"
          if git diff --quiet HEAD origin/main; then
            echo "No durable tournament updates to push."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push was rejected, rebasing onto latest origin/main before retry ${attempt}."
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to push tournament updates after rebasing."
          exit 1
